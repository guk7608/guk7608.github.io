<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀 · 성광감리교회</title>
<meta name="description" content="성광감리교회 새벽설교(사사기 강해) — 본문 성구 전체와 700-800자 말씀 요약.">
<link rel="canonical" href="https://guk7608.github.io/devotion.html">
<link rel="icon" type="image/png" href="https://guk7608.github.io/favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a85a3c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성광감리교회">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef;
    --surface:#fffdf9;
    --ink:#20242c;
    --ink-soft:#565b66;
    --line:#e1dccf;
    --gold:#c99a3c;
    --gold-ink:#5a4213;
    --brick:#a85a3c;
    --dawn-1:#232c47;
    --dawn-2:#5c4a6e;
    --dawn-3:#c9793f;
    --dawn-4:#eec468;
    --shadow: 0 18px 40px -22px rgba(32,36,44,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
      --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
      --dawn-1:#171b2c; --dawn-2:#3c3150; --dawn-3:#a5623a; --dawn-4:#e3b357;
      --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
    --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
    --dawn-1:#171b2c; --dawn-2:#3c3150; --dawn-3:#a5623a; --dawn-4:#e3b357;
    --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, sans-serif; line-height:1.75;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1,.serif{font-family:"Noto Serif KR", serif; text-wrap:balance; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:680px; margin:0 auto; padding:0 24px;}

  header.site{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; max-width:680px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:"Noto Serif KR",serif; font-weight:700; font-size:1.1rem; text-decoration:none;}
  .brand img{width:22px; height:22px; flex:none;}
  .home-link{font-size:0.88rem; font-weight:600; color:var(--ink-soft); text-decoration:none;}
  .home-link:hover{color:var(--brick);}

  main{padding:48px 0 80px;}

  .devo-card{
    position:relative; overflow:hidden;
    background:linear-gradient(160deg, var(--dawn-1), var(--dawn-2) 55%, var(--dawn-3) 100%);
    color:#f7f1e4; border-radius:8px;
    padding:clamp(28px,6vw,52px);
    box-shadow:var(--shadow);
    margin-bottom:36px;
  }
  .card-motif{position:absolute; inset:0; z-index:0; pointer-events:none;}
  .card-motif svg{position:absolute; bottom:0; left:0; width:100%; height:auto; display:block;}
  .card-body{position:relative; z-index:1;}
  .devo-date{
    font-size:0.82rem; letter-spacing:0.08em; color:#f4dfae; font-weight:700;
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
  }
  .devo-date::before{content:"☀"; font-size:1rem;}
  blockquote.devo-verse{
    margin:0 0 18px; font-family:"Noto Serif KR",serif;
    font-size:1.05rem; font-weight:500; line-height:1.85;
  }
  .devo-ref{font-weight:700; color:#f4dfae; font-size:0.98rem;}
  .devo-series{font-size:0.85rem; color:#efe3c8cc; margin-top:4px;}

  .reflection{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:clamp(24px,5vw,38px);
  }
  .reflection .kicker{
    font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brick); font-weight:700; margin:0 0 14px;
  }
  .reflection p{margin:0 0 16px; font-size:1.03rem; color:var(--ink);}
  .reflection p:last-child{margin-bottom:0;}

  .devo-nav{
    display:flex; justify-content:space-between; gap:16px; margin-top:32px;
    font-size:0.9rem; font-weight:600;
  }
  .devo-nav a{text-decoration:none; color:var(--ink-soft); padding:8px 4px;}
  .devo-nav a:hover{color:var(--brick);}
  .devo-nav .disabled{visibility:hidden;}

  .comments{
    margin-top:36px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:clamp(22px,5vw,34px);
  }
  .comments .kicker{
    font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brick); font-weight:700; margin:0 0 16px;
  }
  .comment-list{display:flex; flex-direction:column; gap:14px; margin-bottom:20px;}
  .comment-empty{color:var(--ink-soft); font-size:0.92rem; margin:0;}
  .comment-item{border-bottom:1px solid var(--line); padding-bottom:14px;}
  .comment-item:last-child{border-bottom:none; padding-bottom:0;}
  .comment-meta{font-size:0.82rem; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .comment-text{font-size:0.95rem; white-space:pre-wrap;}
  .comment-form{display:flex; flex-direction:column; gap:10px;}
  .comment-form input, .comment-form textarea{
    width:100%; border:1px solid var(--line); border-radius:6px; background:var(--bg);
    color:var(--ink); font-family:inherit; font-size:0.92rem; padding:10px 12px; resize:vertical;
  }
  .comment-form input:focus, .comment-form textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .comment-form-row{display:flex; align-items:center; justify-content:flex-end; gap:12px;}
  .comment-error{font-size:0.82rem; color:#c0392b; flex:1;}
  .comment-form button{
    background:var(--brick); color:#fff8ee; border:none; border-radius:6px;
    padding:9px 20px; font-family:inherit; font-size:0.9rem; font-weight:700; cursor:pointer;
  }
  .comment-form button:disabled{opacity:0.6; cursor:default;}
  .comment-form button:hover:not(:disabled){filter:brightness(1.08);}

  .board{margin-top:48px;}
  .board .kicker{
    font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brick); font-weight:700; margin:0 0 14px;
  }
  .board-table{
    width:100%; border-collapse:collapse;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    overflow:hidden;
  }
  .board-table td{padding:13px 16px; border-bottom:1px solid var(--line); font-size:0.92rem;}
  .board-table tr:last-child td{border-bottom:none;}
  .board-table tr{cursor:pointer;}
  .board-table tr:hover td{background:var(--bg);}
  .board-table tr.current td{background:color-mix(in srgb, var(--gold) 18%, var(--surface)); font-weight:700;}
  .board-date{color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap; width:1%;}
  .board-pager{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:14px; font-size:0.85rem; color:var(--ink-soft);
  }
  .board-pager button{
    background:none; border:1px solid var(--line); border-radius:4px;
    padding:7px 16px; cursor:pointer; color:var(--ink);
    font-family:inherit; font-size:0.85rem; font-weight:600;
  }
  .board-pager button:disabled{opacity:0.4; cursor:default;}
  .board-pager button:hover:not(:disabled){border-color:var(--brick); color:var(--brick);}

  footer{border-top:1px solid var(--line); padding:28px 0 40px; color:var(--ink-soft); font-size:0.85rem; text-align:center;}
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <a class="brand" href="index.html">
      <img src="kmc-logo.gif" alt="기독교대한감리회">
      성광감리교회
    </a>
    <a class="home-link" href="index.html">← 홈으로</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="devo-card">
      <div class="card-motif" aria-hidden="true">
        <svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
          <g stroke="#f4dfae" stroke-width="1" opacity="0.35">
            <line x1="320" y1="6" x2="70" y2="210"/>
            <line x1="320" y1="6" x2="150" y2="210"/>
            <line x1="320" y1="6" x2="230" y2="210"/>
            <line x1="320" y1="6" x2="320" y2="210"/>
            <line x1="320" y1="6" x2="410" y2="210"/>
            <line x1="320" y1="6" x2="490" y2="210"/>
            <line x1="320" y1="6" x2="570" y2="210"/>
          </g>
          <g stroke="#f4dfae" stroke-width="3" stroke-linecap="round" opacity="0.55">
            <line x1="320" y1="0" x2="320" y2="34"/>
            <line x1="306" y1="12" x2="334" y2="12"/>
          </g>
          <g stroke="#f4dfae" stroke-width="1.6" fill="none" opacity="0.3">
            <path d="M215,220 v-46 a35,35 0 0 1 70,0 v46 z"/>
            <path d="M285,220 v-46 a35,35 0 0 1 70,0 v46 z"/>
            <path d="M355,220 v-46 a35,35 0 0 1 70,0 v46 z"/>
          </g>
        </svg>
      </div>
      <div class="card-body">
        <div class="devo-date" id="devo-date">불러오는 중…</div>
        <blockquote class="devo-verse" id="devo-verse"></blockquote>
        <div class="devo-ref" id="devo-ref"></div>
        <div class="devo-series" id="devo-series"></div>
      </div>
    </div>

    <div class="reflection">
      <p class="kicker">말씀 요약</p>
      <div id="devo-reflection"></div>
    </div>

    <div class="devo-nav">
      <a id="nav-prev" href="#">← 이전 말씀</a>
      <a id="nav-next" href="#">다음 말씀 →</a>
    </div>

    <div class="comments" id="comments"></div>

    <div class="board">
      <p class="kicker">전체 목록</p>
      <table class="board-table"><tbody id="board-body"></tbody></table>
      <div class="board-pager">
        <button id="board-prev" type="button">← 이전 목록</button>
        <span id="board-page-info"></span>
        <button id="board-next" type="button">다음 목록 →</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> 성광감리교회 · 강원특별자치도 삼척시 도계읍 도계우회로2길 48</div>
</footer>

<script src="verses-data.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="comments.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function ymd(d){
    var m = ('0' + (d.getMonth()+1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }

  // 아직 오지 않은 날짜(다음 날 이후)의 묵상은 다음글/게시판 어디서도 노출하지 않는다.
  var todayKey = ymd(new Date());
  var activeIdx = 0;
  for (var ai = 0; ai < sermonVerses.length; ai++) {
    if (sermonVerses[ai].date <= todayKey) activeIdx = ai;
  }

  var params = new URLSearchParams(location.search);
  var requestedDate = params.get('date');

  var idx = -1;
  if (requestedDate) {
    idx = sermonVerses.findIndex(function(item){ return item.date === requestedDate; });
  }
  if (idx === -1 || idx > activeIdx) {
    idx = activeIdx;
  }

  var v = sermonVerses[idx];
  var displayDate = new Date(v.date + 'T00:00:00');
  var dateStr = displayDate.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  document.title = v.series + ' · 성광감리교회';
  document.getElementById('devo-date').textContent = dateStr + ' 말씀';
  document.getElementById('devo-verse').textContent = '“' + (v.fullPassage || v.verse) + '”';
  document.getElementById('devo-ref').textContent = v.fullRef || v.ref;
  document.getElementById('devo-series').textContent = v.series;

  var reflectionHost = document.getElementById('devo-reflection');
  var reflectionParas = v.reflection ? v.reflection.split(/\n\s*\n/) : ['이 날짜의 말씀 요약은 아직 준비되지 않았습니다.'];
  reflectionParas.forEach(function(para){
    var p = document.createElement('p');
    p.textContent = para.trim();
    reflectionHost.appendChild(p);
  });

  initCommentBox('comments', 'devotion-' + v.date);

  var prevEl = document.getElementById('nav-prev');
  var nextEl = document.getElementById('nav-next');
  if (idx > 0) {
    prevEl.href = 'devotion.html?date=' + sermonVerses[idx - 1].date;
  } else {
    prevEl.classList.add('disabled');
  }
  if (idx < activeIdx) {
    nextEl.href = 'devotion.html?date=' + sermonVerses[idx + 1].date;
  } else {
    nextEl.classList.add('disabled');
  }

  (function(){
    var PAGE_SIZE = 7;
    var boardBody = document.getElementById('board-body');
    var pageInfo = document.getElementById('board-page-info');
    var prevBtn = document.getElementById('board-prev');
    var nextBtn = document.getElementById('board-next');
    var visibleCount = activeIdx + 1;
    var totalPages = Math.ceil(visibleCount / PAGE_SIZE);
    var currentPage = 0;

    function render(page){
      currentPage = Math.max(0, Math.min(page, totalPages - 1));
      boardBody.innerHTML = '';
      var startIdxDesc = visibleCount - 1 - currentPage * PAGE_SIZE;
      for (var i = 0; i < PAGE_SIZE; i++) {
        var itemIdx = startIdxDesc - i;
        if (itemIdx < 0) break;
        var item = sermonVerses[itemIdx];
        var tr = document.createElement('tr');
        if (itemIdx === idx) tr.className = 'current';
        var d = new Date(item.date + 'T00:00:00');
        var dLabel = d.toLocaleDateString('ko-KR', { month:'short', day:'numeric', weekday:'short' });
        var tdDate = document.createElement('td');
        tdDate.className = 'board-date';
        tdDate.textContent = dLabel;
        var tdTitle = document.createElement('td');
        tdTitle.textContent = item.series;
        tr.appendChild(tdDate);
        tr.appendChild(tdTitle);
        tr.addEventListener('click', (function(dt){ return function(){ location.href = 'devotion.html?date=' + dt; }; })(item.date));
        boardBody.appendChild(tr);
      }
      pageInfo.textContent = (currentPage + 1) + ' / ' + totalPages;
      prevBtn.disabled = currentPage <= 0;
      nextBtn.disabled = currentPage >= totalPages - 1;
    }

    var descIndex = visibleCount - 1 - idx;
    render(Math.floor(descIndex / PAGE_SIZE));

    prevBtn.addEventListener('click', function(){ render(currentPage - 1); });
    nextBtn.addEventListener('click', function(){ render(currentPage + 1); });
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
</script>
</body>
</html>
