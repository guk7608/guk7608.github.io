<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀샤우팅 · 성광감리교회</title>
<meta name="description" content="영상 한 편과 함께, 확신·선포·감사·찬양의 말씀을 소리 내어 선포합니다.">
<link rel="canonical" href="https://guk7608.github.io/word-shout.html">
<link rel="icon" type="image/png" href="https://guk7608.github.io/favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a85a3c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성광감리교회">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef;
    --surface:#fffdf9;
    --ink:#20242c;
    --ink-soft:#565b66;
    --line:#e1dccf;
    --gold:#c99a3c;
    --gold-ink:#5a4213;
    --brick:#a85a3c;
    --shadow: 0 18px 40px -22px rgba(32,36,44,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
      --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
      --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
    --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
    --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, sans-serif; line-height:1.75;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1,h2,.serif{font-family:"Noto Serif KR", serif; text-wrap:balance; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  header.site{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; max-width:900px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:"Noto Serif KR",serif; font-weight:700; font-size:1.1rem; text-decoration:none;}
  .brand img{width:22px; height:22px; flex:none;}
  .home-link{font-size:0.88rem; font-weight:600; color:var(--ink-soft); text-decoration:none;}
  .home-link:hover{color:var(--brick);}

  main{padding:48px 0 80px;}
  .page-head{margin-bottom:36px;}
  .page-head .kicker{
    font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brick); font-weight:700; margin:0 0 10px;
  }
  .page-head h1{font-size:clamp(1.6rem,4vw,2.1rem); margin:0 0 10px; font-weight:700;}
  .page-head p{color:var(--ink-soft); margin:0; max-width:60ch;}

  .video-frame{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#12141a; border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow); margin-bottom:44px;
  }
  .video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; color:#cfc9ba; text-align:center; padding:24px;
    border:1px dashed rgba(255,255,255,0.25); border-radius:10px;
  }
  .video-empty strong{font-size:1rem; color:#f2ecdc;}
  .video-empty span{font-size:0.85rem; color:#9d968a;}

  .shout-intro{text-align:center; margin-bottom:28px;}
  .shout-intro p{color:var(--brick); font-weight:700; font-size:1.02rem; margin:0;}

  .filter-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:28px;}
  .filter-chip{
    padding:8px 18px; border-radius:20px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:0.85rem; font-weight:600;
    cursor:pointer; transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .filter-chip:hover{border-color:var(--brick);}
  .filter-chip[aria-pressed="true"]{background:var(--brick); color:#fff; border-color:var(--brick);}

  .shout-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:52px 36px; text-align:center;
    min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; transition:opacity 0.18s ease;
  }
  .shout-card.fading{opacity:0;}
  .shout-tag{
    display:inline-block; padding:5px 14px; border-radius:14px; font-size:0.78rem;
    font-weight:700; letter-spacing:0.04em; background:var(--gold); color:var(--gold-ink);
  }
  .shout-text{
    font-family:"Noto Serif KR", serif; font-weight:600; letter-spacing:-0.01em;
    font-size:clamp(1.35rem, 3.4vw, 1.9rem); line-height:1.6; margin:0; max-width:34ch;
  }
  .shout-ref{color:var(--ink-soft); font-size:0.95rem; font-weight:700;}

  .shout-actions{display:flex; justify-content:center; margin-top:28px;}
  .shout-next{
    padding:14px 32px; border-radius:30px; border:none; background:var(--brick);
    color:#fff; font-size:1rem; font-weight:700; cursor:pointer; box-shadow:var(--shadow);
    transition:transform 0.15s ease, filter 0.15s ease;
  }
  .shout-next:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .shout-next:active{transform:translateY(0);}

  .shout-count{text-align:center; margin-top:14px; color:var(--ink-soft); font-size:0.82rem;}

  footer{border-top:1px solid var(--line); padding:28px 0 40px; color:var(--ink-soft); font-size:0.85rem; text-align:center;}

  @media (max-width:600px){
    .shout-card{padding:38px 22px;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <a class="brand" href="index.html">
      <img src="kmc-logo.gif" alt="기독교대한감리회">
      성광감리교회
    </a>
    <a class="home-link" href="index.html">← 홈으로</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">Word Shouting</p>
      <h1>말씀샤우팅</h1>
      <p>영상 한 편을 먼저 보고, 이어지는 말씀선포카드를 소리 내어 읽으며 오늘의 소망을 선포해보세요.</p>
    </div>

    <div class="video-frame">
      <!-- 영상 링크가 정해지면 위 div 대신 아래 형태의 iframe으로 교체:
      <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="말씀샤우팅 영상" allowfullscreen loading="lazy"></iframe>
      -->
      <div class="video-empty">
        <strong>영상 준비 중입니다</strong>
        <span>말씀샤우팅에 함께할 영상이 정해지면 이 자리에 채워집니다.</span>
      </div>
    </div>

    <div class="shout-intro">
      <p>소리 내어 함께 선포해보세요</p>
    </div>

    <div class="filter-row" id="filter-row" role="group" aria-label="말씀 종류 선택"></div>

    <div class="shout-card" id="shout-card">
      <span class="shout-tag" id="shout-tag"></span>
      <p class="shout-text" id="shout-text"></p>
      <span class="shout-ref" id="shout-ref"></span>
    </div>

    <div class="shout-actions">
      <button type="button" class="shout-next" id="shout-next">다음 말씀 보기 →</button>
    </div>
    <p class="shout-count" id="shout-count"></p>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> 성광감리교회 · 강원특별자치도 삼척시 도계읍 도계우회로2길 48</div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var CATEGORIES = [
    { key:'all', label:'전체' },
    { key:'assurance', label:'확신' },
    { key:'proclaim', label:'선포형' },
    { key:'thanks', label:'감사' },
    { key:'praise', label:'찬양' }
  ];

  // 모든 구절은 개역개정(대한성서공회) 원문을 대한성서공회 성경플랫폼(bible.bskorea.or.kr)에서 대조해 그대로 옮김.
  var VERSES = [
    { cat:'assurance', ref:'빌립보서 4:13', text:'내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라' },
    { cat:'assurance', ref:'로마서 8:28', text:'우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라' },
    { cat:'assurance', ref:'이사야 41:10', text:'두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라' },
    { cat:'assurance', ref:'시편 23:1', text:'여호와는 나의 목자시니 내게 부족함이 없으리로다' },
    { cat:'assurance', ref:'요한복음 14:27', text:'평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것과 같지 아니하니라 너희는 마음에 근심하지도 말고 두려워하지도 말라' },

    { cat:'proclaim', ref:'로마서 8:37', text:'그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 넉넉히 이기느니라' },
    { cat:'proclaim', ref:'여호수아 1:9', text:'내가 네게 명령한 것이 아니냐 강하고 담대하라 두려워하지 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라' },
    { cat:'proclaim', ref:'시편 118:17', text:'내가 죽지 않고 살아서 여호와께서 하시는 일을 선포하리로다' },
    { cat:'proclaim', ref:'이사야 54:17', text:'너를 치려고 제조된 모든 연장이 쓸모가 없을 것이라 일어나 너를 대적하여 송사하는 모든 혀는 네게 정죄를 당하리니 이는 여호와의 종들의 기업이요 이는 그들이 내게서 얻은 공의니라' },
    { cat:'proclaim', ref:'히브리서 13:6', text:'주는 나를 돕는 이시니 내가 무서워하지 아니하겠노라 사람이 내게 어찌하리요' },

    { cat:'thanks', ref:'데살로니가전서 5:18', text:'범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라' },
    { cat:'thanks', ref:'시편 100:4', text:'감사함으로 그의 문에 들어가며 찬송함으로 그의 궁정에 들어가서 그에게 감사하며 그의 이름을 송축할지어다' },
    { cat:'thanks', ref:'골로새서 3:17', text:'무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라' },
    { cat:'thanks', ref:'시편 136:1', text:'여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다' },

    { cat:'praise', ref:'시편 150:6', text:'호흡이 있는 자마다 여호와를 찬양할지어다 할렐루야' },
    { cat:'praise', ref:'시편 34:1', text:'내가 여호와를 항상 송축함이여 내 입술로 항상 주를 찬양하리이다' },
    { cat:'praise', ref:'시편 103:1', text:'내 영혼아 여호와를 송축하라 내 속에 있는 것들아 다 그의 거룩한 이름을 송축하라' },
    { cat:'praise', ref:'이사야 12:5', text:'여호와를 찬송할 것은 극히 아름다운 일을 하셨음이니 이를 온 땅에 알게 할지어다' }
  ];

  var CAT_LABEL = {};
  CATEGORIES.forEach(function(c){ if (c.key !== 'all') CAT_LABEL[c.key] = c.label; });

  var filterRow = document.getElementById('filter-row');
  var currentFilter = 'all';
  var lastIndex = -1;
  var shownCount = 0;

  CATEGORIES.forEach(function(c){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-chip';
    btn.textContent = c.label;
    btn.setAttribute('aria-pressed', c.key === 'all' ? 'true' : 'false');
    btn.addEventListener('click', function(){
      currentFilter = c.key;
      filterRow.querySelectorAll('.filter-chip').forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
      showNext();
    });
    filterRow.appendChild(btn);
  });

  function pool(){
    return currentFilter === 'all' ? VERSES : VERSES.filter(function(v){ return v.cat === currentFilter; });
  }

  var cardEl = document.getElementById('shout-card');
  var tagEl = document.getElementById('shout-tag');
  var textEl = document.getElementById('shout-text');
  var refEl = document.getElementById('shout-ref');
  var countEl = document.getElementById('shout-count');

  function showNext(){
    var list = pool();
    if (list.length === 0) return;
    var idx = Math.floor(Math.random() * list.length);
    if (list.length > 1) {
      while (idx === lastIndex) idx = Math.floor(Math.random() * list.length);
    }
    lastIndex = idx;
    var v = list[idx];

    cardEl.classList.add('fading');
    setTimeout(function(){
      tagEl.textContent = CAT_LABEL[v.cat];
      textEl.textContent = '“' + v.text + '”';
      refEl.textContent = v.ref;
      cardEl.classList.remove('fading');
    }, 140);

    shownCount += 1;
    countEl.textContent = shownCount + '번째 말씀';
  }

  document.getElementById('shout-next').addEventListener('click', showNext);
  showNext();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
</script>
</body>
</html>
