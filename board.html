<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코이노니아 · 성광감리교회</title>
<meta name="description" content="성광감리교회 엘리사마 찬양단·마하나님 청년부 소식 게시판.">
<link rel="canonical" href="https://guk7608.github.io/board.html">
<link rel="icon" type="image/png" href="https://guk7608.github.io/favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a85a3c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성광감리교회">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --surface:#fffdf9; --ink:#20242c; --ink-soft:#565b66;
    --line:#e1dccf; --gold:#c99a3c; --gold-ink:#5a4213; --brick:#a85a3c;
    --shadow: 0 18px 40px -22px rgba(32,36,44,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
      --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
      --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
    --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
    --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, sans-serif; line-height:1.75;
    -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word;
  }
  h1,.serif{font-family:"Noto Serif KR", serif; text-wrap:balance; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px;}

  header.site{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .navbar{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:720px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:"Noto Serif KR",serif; font-weight:700; font-size:1.1rem; text-decoration:none;}
  .brand img{width:22px; height:22px; flex:none;}
  .home-link{font-size:0.88rem; font-weight:600; color:var(--ink-soft); text-decoration:none;}
  .home-link:hover{color:var(--brick);}

  main{padding:48px 0 80px;}
  .page-head{margin-bottom:32px;}
  .page-head .kicker{font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--brick); font-weight:700; margin:0 0 10px;}
  .page-head h1{font-size:clamp(1.6rem,4vw,2.1rem); margin:0 0 10px; font-weight:700;}
  .page-head p{color:var(--ink-soft); margin:0; max-width:60ch;}

  .board-empty{padding:32px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:8px; font-size:0.95rem;}

  .board-list{display:flex; flex-direction:column; gap:20px; margin-bottom:40px;}
  .board-item{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:20px; position:relative;}
  .board-meta{font-size:0.82rem; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
  .board-item-title{font-size:1.1rem; font-weight:700; margin:0 0 8px;}
  .board-item-text{font-size:0.95rem; white-space:pre-wrap; margin:0 0 12px;}
  .board-video{position:relative; width:100%; padding-top:56.25%; border-radius:8px; overflow:hidden; margin-bottom:8px;}
  .board-video iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .board-video-link{display:inline-block; font-size:0.9rem; font-weight:600; color:var(--brick); text-decoration:none;}
  .board-actions{position:absolute; top:16px; right:16px; display:flex; gap:8px;}
  .board-action-btn{
    background:none; border:1px solid var(--line);
    border-radius:6px; padding:4px 10px; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;
  }
  .board-action-btn:hover{color:var(--brick); border-color:var(--brick);}
  .board-edit-form{margin-top:4px;}
  .board-form-row .board-action-btn{background:none; color:var(--ink-soft); font-weight:400;}

  .board-write{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:24px;}
  .board-write h2{font-size:1.05rem; margin:0 0 16px;}
  .board-form{display:flex; flex-direction:column; gap:12px;}
  .board-form input, .board-form textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font:inherit; font-size:0.92rem;
  }
  .board-form input:focus, .board-form textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .board-form-row{display:flex; align-items:center; justify-content:flex-end; gap:12px;}
  .board-error{font-size:0.82rem; color:#c0392b; flex:1;}
  .board-form button{
    background:var(--brick); color:#fff8ee; border:none; border-radius:8px;
    padding:10px 20px; font-size:0.92rem; font-weight:700; cursor:pointer;
  }
  .board-form button:disabled{opacity:0.6; cursor:default;}
  .board-form button:hover:not(:disabled){filter:brightness(1.08);}
  .board-hint{font-size:0.8rem; color:var(--ink-soft); margin:-4px 0 4px;}

  footer{border-top:1px solid var(--line); padding:28px 0 40px; color:var(--ink-soft); font-size:0.85rem; text-align:center;}
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <a class="brand" href="index.html">
      <img src="kmc-logo.gif" alt="기독교대한감리회">
      성광감리교회
    </a>
    <a class="home-link" href="index.html">← 홈으로</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">Department News</p>
      <h1 id="board-title">코이노니아</h1>
      <p id="board-desc"></p>
    </div>

    <div id="board-list" class="board-list"></div>

    <div class="board-write">
      <h2>글쓰기</h2>
      <form id="board-form" class="board-form">
        <input type="text" id="board-author" maxlength="20" placeholder="이름 (선택, 기본 익명)">
        <input type="text" id="board-post-title" maxlength="60" placeholder="제목" required>
        <textarea id="board-content" rows="4" maxlength="1000" placeholder="내용을 입력해 주세요."></textarea>
        <input type="url" id="board-video-url" placeholder="영상 링크 (선택, 유튜브 주소)">
        <input type="password" id="board-write-pass" placeholder="부서 비밀번호" required>
        <p class="board-hint">부서원끼리 공유하는 글쓰기 비밀번호입니다. 모르시면 부서 담당자에게 문의해 주세요.</p>
        <div class="board-form-row">
          <span class="board-error" id="board-error"></span>
          <button type="submit">게시하기</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> 성광감리교회 · 강원특별자치도 삼척시 도계읍 도계우회로2길 48</div>
</footer>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="board.js?v=2"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  var dept = new URLSearchParams(location.search).get('dept');
  initBoard(dept);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
</script>
</body>
</html>
