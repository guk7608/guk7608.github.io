<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀샤우팅 · 성광감리교회</title>
<meta name="description" content="성광감리교회 말씀샤우팅 — 성경암송구절을 하루 한 구절씩 순서대로 암송합니다.">
<link rel="canonical" href="https://guk7608.github.io/word-shout.html">
<link rel="icon" type="image/png" href="https://guk7608.github.io/favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a85a3c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성광감리교회">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --surface:#fffdf9; --ink:#20242c; --ink-soft:#565b66;
    --line:#e1dccf; --gold:#c99a3c; --gold-ink:#5a4213; --brick:#a85a3c;
    --shadow: 0 18px 40px -22px rgba(32,36,44,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
      --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
      --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161c; --surface:#1b1e26; --ink:#eae7de; --ink-soft:#a9a79e;
    --line:#31353f; --gold:#e3b357; --gold-ink:#241a08; --brick:#d98a68;
    --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, sans-serif; line-height:1.75;
    -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word;
  }
  h1,.serif{font-family:"Noto Serif KR", serif; text-wrap:balance; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px;}

  header.site{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .navbar{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:720px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:"Noto Serif KR",serif; font-weight:700; font-size:1.1rem; text-decoration:none;}
  .brand img{width:22px; height:22px; flex:none;}
  .home-link{font-size:0.88rem; font-weight:600; color:var(--ink-soft); text-decoration:none;}
  .home-link:hover{color:var(--brick);}

  main{padding:48px 0 80px;}
  .page-head{margin-bottom:32px;}
  .page-head .kicker{font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--brick); font-weight:700; margin:0 0 10px;}
  .page-head h1{font-size:clamp(1.6rem,4vw,2.1rem); margin:0 0 10px; font-weight:700;}
  .page-head p{color:var(--ink-soft); margin:0; max-width:60ch;}

  .shout-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:48px 36px; text-align:center;
  }
  .shout-date{font-size:0.85rem; font-weight:700; color:var(--brick); letter-spacing:.04em; margin-bottom:22px;}
  .shout-tag{
    display:inline-block; padding:5px 14px; border-radius:14px; font-size:0.78rem;
    font-weight:700; letter-spacing:0.04em; background:var(--gold); color:var(--gold-ink); margin-bottom:18px;
  }
  .shout-text{
    font-family:"Noto Serif KR", serif; font-weight:600; letter-spacing:-0.01em;
    font-size:clamp(1.35rem, 3.4vw, 1.9rem); line-height:1.75; margin:0 0 18px;
  }
  .shout-text .line + .line{margin-top:6px;}
  .shout-ref{color:var(--ink-soft); font-size:0.95rem; font-weight:700;}
  .shout-topic{color:var(--ink-soft); font-size:0.82rem; margin-top:4px;}

  .shout-progress{text-align:center; margin-top:18px; color:var(--ink-soft); font-size:0.82rem;}
  .shout-empty{padding:32px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:8px; font-size:0.95rem;}

  footer{border-top:1px solid var(--line); padding:28px 0 40px; color:var(--ink-soft); font-size:0.85rem; text-align:center;}
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <a class="brand" href="index.html">
      <img src="kmc-logo.gif" alt="기독교대한감리회">
      성광감리교회
    </a>
    <a class="home-link" href="index.html">← 홈으로</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <p class="kicker">Word Shouting · 한 구절 매일암송</p>
      <h1>말씀샤우팅</h1>
      <p>성경암송구절을 구약과 신약 순서대로 매일 한 구절씩 소리 내어 외워봅시다.</p>
    </div>

    <div id="shout-host"></div>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> 성광감리교회 · 강원특별자치도 삼척시 도계읍 도계우회로2길 48</div>
</footer>

<script src="word-shout-data.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var ALL_VERSES = (window.OT_VERSES || []).concat(window.NT_VERSES || []);
  var host = document.getElementById('shout-host');

  if (ALL_VERSES.length === 0) {
    host.innerHTML = '<p class="shout-empty">아직 준비된 암송구절이 없습니다.</p>';
  } else {
    // 매일 새벽 5시를 기준으로 그 날의 구절로 갱신(성경통독과 동일한 방식).
    // 2026-01-01을 0번째 날로 삼아, 구약 329개+신약 267개=총 591개 구절을 순서대로
    // 하루 한 구절씩 돌며, 다 돌면(약 1년 7개월) 처음부터 다시 순환한다.
    var EPOCH = new Date(2026, 0, 1);
    var now = new Date();
    if (now.getHours() < 5) now.setDate(now.getDate() - 1);
    now.setHours(0, 0, 0, 0);
    var epochMidnight = new Date(EPOCH.getFullYear(), EPOCH.getMonth(), EPOCH.getDate());
    var daysSinceEpoch = Math.floor((now - epochMidnight) / 86400000);
    var idx = ((daysSinceEpoch % ALL_VERSES.length) + ALL_VERSES.length) % ALL_VERSES.length;
    var v = ALL_VERSES[idx];

    var dateStr = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

    var card = document.createElement('div');
    card.className = 'shout-card';

    var textHtml = v.text.split(' / ').map(function (part) {
      return '<span class="line">' + part.trim() + '</span>';
    }).join('<br>');

    card.innerHTML =
      '<div class="shout-date">' + dateStr + '</div>' +
      '<span class="shout-tag">' + v.book + '</span>' +
      '<p class="shout-text">“' + textHtml + '”</p>' +
      '<div class="shout-ref">' + v.ref + '</div>' +
      '<div class="shout-topic">' + v.topic + '</div>';
    host.appendChild(card);

    var progress = document.createElement('p');
    progress.className = 'shout-progress';
    progress.textContent = '전체 ' + ALL_VERSES.length + '구절 중 ' + (idx + 1) + '번째';
    host.appendChild(progress);
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
</script>
</body>
</html>
